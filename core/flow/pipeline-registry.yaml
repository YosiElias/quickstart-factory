# Pipeline Registry — How to fill
#
# skills[].expected_inputs:
#   - Set required: true/false for each input (defaults to true if not set)
#   - qs-name is always required; other inputs are typically optional
#
# skills[].expected_outputs:
#   - path supports glob patterns (e.g. data/*.json, core/out-*)
#
# skills[].review_guidance:
#   - Keep to 4 lines max — only the most important checks the user must note
#   - Always end with a peer review recommendation
#   - Write any path you want the user to open as a markdown link with a
#     factory-root-relative target. pipeline-checkpoint.py rewrites it relative
#     to the dashboard at render time — never hardcode a ../../../ prefix.
#
# All paths in this file (expected_outputs, review_guidance links) are relative
# to the quickstart-factory repo root, regardless of the skill's working dir.
#
pipeline:
  name: greenfield
  description: End-to-end new AI Quickstart pipeline

skills:
  - id: rh-qs-discovery
    order: 1
    description: "Ideation and interview phase — asks structured questions, accepts uploaded context, maps ideas to concrete requirements, and produces a PRD"
    expected_inputs:
      - name: qs-name
        description: "Quickstart slug (lowercase, hyphenated, e.g. mortgage-application-processor)"
        required: true
      - name: idea-summary
        description: "Concise summary of the user's quickstart idea (1-3 sentences)"
        required: false
      - name: idea-keywords
        description: "Key technologies, use cases, and industry terms extracted from the idea"
        required: false
      - name: backlog-data
        description: "Full backlog output from gh-backlog-reader (issue numbers, titles, bodies, labels, assignees)"
        required: false
    expected_outputs:
      - path: ".rhoai-qs/{qs-name}/.qs-factory/prds/prd.md"
        description: "Structured PRD ready for rh-qs-architect"
      - path: ".rhoai-qs/{qs-name}/chart/Chart.yaml"
        description: "Proof the repo was seeded from ai-quickstart-template in Phase 4a — without this the checkpoint shows discovery green even if seeding never ran"
    review_guidance: |
      - PRD exists at [.rhoai-qs/{qs-name}/.qs-factory/prds/prd.md](.rhoai-qs/{qs-name}/.qs-factory/prds/prd.md) with all sections filled in
      - Review PRD content for completeness: problem statement, target persona, success metrics, scope boundaries, and technology constraints
      - Recommend getting a peer engineer review on the PRD before continuing
    next_skill: rh-qs-architect

  - id: rh-qs-architect
    order: 2
    description: "Architecture phase — reads PRD, maps requirements to OpenShift AI and ai-architecture-charts, produces structured architecture spec with Mermaid diagram"
    expected_inputs:
      - name: qs-name
        description: "Quickstart slug"
    expected_outputs:
      - path: ".rhoai-qs/{qs-name}/.qs-factory/designs/architecture-spec.yaml"
        description: "Structured YAML handoff spec with technology stack, component BOM, integration_patterns (protocols, data flows, security boundaries), testing strategy, and upstream dependencies"
      - path: ".rhoai-qs/{qs-name}/.qs-factory/designs/architecture-diagram.mmd"
        description: "Mermaid architecture diagram referenced by architecture-spec.yaml"
    review_guidance: |
      - architecture-spec.yaml exists at [.rhoai-qs/{qs-name}/.qs-factory/designs/architecture-spec.yaml](.rhoai-qs/{qs-name}/.qs-factory/designs/architecture-spec.yaml) with all required sections filled in
      - Review content: technology_stack complete, component BOM matches PRD, integration_patterns cover non-obvious protocols/flows/security boundaries, chart versions pinned, testing_strategy defined, dependencies include content_hash
      - architecture-diagram.mmd exists at [.rhoai-qs/{qs-name}/.qs-factory/designs/architecture-diagram.mmd](.rhoai-qs/{qs-name}/.qs-factory/designs/architecture-diagram.mmd) and matches components
      - Recommend getting a peer engineer review on the architecture spec before continuing
    next_skill: rh-qs-scaffold

  - id: rh-qs-scaffold
    order: 3
    description: "Scaffold a new AI Quickstart GitHub repo with CI/CD, linting, testing frameworks, monorepo structure, and Makefile targets"
    expected_inputs:
      - name: qs-name
        description: "Quickstart slug"
    expected_outputs:
      - path: ".rhoai-qs/{qs-name}/.qs-factory/pipeline/scaffold-manifest.yaml"
        description: "Handoff manifest listing created files, packages, CI jobs, and linting config"
    review_guidance: |
      - scaffold-manifest.yaml exists in [.rhoai-qs/{qs-name}/.qs-factory/pipeline/scaffold-manifest.yaml](.rhoai-qs/{qs-name}/.qs-factory/pipeline/scaffold-manifest.yaml)
      - make lint passes, no placeholder strings remain in scaffolded files
      - Review content: repo accessible, Makefile has all standard targets, CI workflows valid
      - Recommend getting a peer engineer review on the scaffold before continuing
    next_skill: rh-qs-implement

  - id: rh-qs-implement
    order: 4
    description: "Implement a working vertical slice — FastAPI backend, React UI, database, RAG ingestion, and tests from approved design and scaffold"
    expected_inputs:
      - name: qs-name
        description: "Quickstart slug"
    expected_outputs:
      - path: ".rhoai-qs/{qs-name}/.qs-factory/pipeline/implementation-manifest.yaml"
        description: "Handoff manifest documenting endpoints, DB models, services, env vars, and test coverage"
    review_guidance: |
      - implementation-manifest.yaml exists in [.rhoai-qs/{qs-name}/.qs-factory/pipeline/implementation-manifest.yaml](.rhoai-qs/{qs-name}/.qs-factory/pipeline/implementation-manifest.yaml)
      - make lint && make test pass with zero failures
      - Review content: all endpoints implemented, no placeholders, no hardcoded secrets
      - Recommend getting a peer engineer review on the implementation before continuing
    next_skill: rh-qs-deploy

  - id: rh-qs-deploy
    order: 5
    description: "Deploy configuration — wires ai-architecture-charts Helm subcharts, compose.yml for local dev, Containerfiles, and Makefile deploy targets"
    expected_inputs:
      - name: qs-name
        description: "Quickstart slug"
    expected_outputs:
      - path: ".rhoai-qs/{qs-name}/.qs-factory/pipeline/deploy-manifest.yaml"
        description: "Handoff manifest recording Helm deps, compose services, Containerfiles, routes, and env vars"
    review_guidance: |
      - deploy-manifest.yaml exists in [.rhoai-qs/{qs-name}/.qs-factory/pipeline/deploy-manifest.yaml](.rhoai-qs/{qs-name}/.qs-factory/pipeline/deploy-manifest.yaml)
      - make helm-lint passes and make dev brings up the local stack
      - Review content: no raw oc/kubectl usage, no committed secrets, Containerfiles use UBI9
      - Recommend getting a peer engineer review on the deploy config before continuing
    next_skill: rh-qs-debug-and-deploy

  # # TODO: fill in when rh-qs-security is implemented
  # - id: rh-qs-security
  #   order: TBD
  #   description: "Security verification — not yet implemented"
  #   expected_inputs: []
  #   expected_outputs: []
  #   review_guidance: ""
  #   next_skill: rh-qs-debug-and-deploy

  - id: rh-qs-debug-and-deploy
    order: 6
    description: "Deploy the quickstart to OpenShift, debug failures in dependency order until all resources are healthy, then verify end-to-end against the test plan"
    expected_inputs:
      - name: qs-name
        description: "Quickstart slug"
        required: true
      - name: namespace
        description: "Target OpenShift namespace — derived as opg-<qs-name>-<user> if omitted"
        required: false
    expected_outputs:
      - path: ".rhoai-qs/{qs-name}/.qs-factory/pipeline/deploy-state.yaml"
        description: "Final cluster health snapshot per resource — handoff to rh-qs-document"
    review_guidance: |
      - deploy-state.yaml exists in [.rhoai-qs/{qs-name}/.qs-factory/pipeline/deploy-state.yaml](.rhoai-qs/{qs-name}/.qs-factory/pipeline/deploy-state.yaml) with overall_status healthy
      - Review content: unhealthy_resources empty, all E2E tests passed, no resource skipped after 3 failed attempts
      - Read [deploy-report.md](.tmp/{qs-name}/debug/deploy-report.md) (local run log, not committed) for root causes and fixes — confirm those fixes went into the quickstart's source, not just onto the cluster
      - Recommend getting a peer engineer review on the applied fixes before continuing
    next_skill: rh-qs-document

  - id: rh-qs-document
    order: 7
    description: "Generate README and catalog documentation from verified deployment — deploy steps, requirements, architecture diagram, and catalog metadata"
    expected_inputs:
      - name: qs-name
        description: "Quickstart slug"
    expected_outputs:
      - path: ".rhoai-qs/{qs-name}/.qs-factory/pipeline/doc-manifest.yaml"
        description: "Documentation handoff manifest with README section status and validation results"
    review_guidance: |
      - doc-manifest.yaml exists in [.rhoai-qs/{qs-name}/.qs-factory/pipeline/doc-manifest.yaml](.rhoai-qs/{qs-name}/.qs-factory/pipeline/doc-manifest.yaml) and all validation booleans are true
      - README deploy commands match Makefile targets, no placeholder content remains
      - Review content: catalog metadata compliant, architecture diagram matches spec
      - Recommend getting a peer engineer review on the docs before continuing
    # rh-qs-document is the last checkpointed step — see the rh-qs-ship note below.
    # Pointing next_skill at a skill the parser cannot see would dangle:
    # pipeline-checkpoint.py resolves it with next(..., None) and silently falls
    # through to its "first skill not done" scan. rh-qs-document's own closing
    # text tells the user to run rh-qs-ship.
    next_skill: null

  # rh-qs-ship is intentionally commented out — it is the final step and its
  # cleanup deletes .qs-factory/, including the dashboard, so there is nothing
  # left to checkpoint. Kept here for reference only: commented entries are
  # invisible to the YAML parser, so pipeline-checkpoint.py and
  # validate-checkpoint.sh both skip it.
